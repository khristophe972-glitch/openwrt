name: Build OpenWrt 25.12 GL-MT6000 Fullcone

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: openwrt-25.12

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync unzip zlib1g-dev \
            file wget quilt automake autoconf libtool

      - name: Add fullcone patches from ImmortalWrt
        run: |
          # libnftnl fullcone patch
          mkdir -p package/libs/libnftnl/patches
          curl -sL "https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/package/libs/libnftnl/patches/001-libnftnl-add-fullcone-expression-support.patch" \
            -o package/libs/libnftnl/patches/001-libnftnl-add-fullcone-expression-support.patch

          # Add PKG_FIXUP:=autoreconf to libnftnl Makefile (needed for fullcone patch)
          sed -i '/^PKG_INSTALL/i PKG_FIXUP:=autoreconf' package/libs/libnftnl/Makefile

          # nftables fullcone patch
          mkdir -p package/network/utils/nftables/patches
          curl -sL "https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/package/network/utils/nftables/patches/002-nftables-add-fullcone-expression-support.patch" \
            -o package/network/utils/nftables/patches/002-nftables-add-fullcone-expression-support.patch

          # firewall4 fullcone patch
          mkdir -p package/network/config/firewall4/patches
          curl -sL "https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/package/network/config/firewall4/patches/001-firewall4-add-support-for-fullcone-nat.patch" \
            -o package/network/config/firewall4/patches/001-firewall4-add-support-for-fullcone-nat.patch

          # fullconenat-nft package
          mkdir -p package/network/utils/fullconenat-nft/patches
          curl -sL "https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/package/network/utils/fullconenat-nft/Makefile" \
            -o package/network/utils/fullconenat-nft/Makefile
          curl -sL "https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/package/network/utils/fullconenat-nft/patches/010-fix-build-with-kernel-6.12.patch" \
            -o package/network/utils/fullconenat-nft/patches/010-fix-build-with-kernel-6.12.patch

          # fullconenat package
          mkdir -p package/network/utils/fullconenat/patches
          mkdir -p package/network/utils/fullconenat/src
          curl -sL "https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/package/network/utils/fullconenat/Makefile" \
            -o package/network/utils/fullconenat/Makefile
          curl -sL "https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/package/network/utils/fullconenat/patches/000-printk.patch" \
            -o package/network/utils/fullconenat/patches/000-printk.patch
          curl -sL "https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/package/network/utils/fullconenat/src/Makefile" \
            -o package/network/utils/fullconenat/src/Makefile


      - name: Enable all network kernel modules
        run: |
          # Activer uniquement les modules réseau/netfilter nécessaires
          # Approche ciblée : liste explicite des configs à activer
          CONFIG=target/linux/generic/config-6.12
          activate() {
            local cfg=$1
            if grep -q "^# $cfg is not set" $CONFIG; then
              sed -i "s/^# $cfg is not set/$cfg=m/" $CONFIG
            elif ! grep -q "^$cfg=" $CONFIG; then
              echo "$cfg=m" >> $CONFIG
            fi
          }
          # Schedulers QoS
          activate CONFIG_NET_SCH_CAKE
          activate CONFIG_NET_SCH_CODEL
          activate CONFIG_NET_SCH_FQ
          activate CONFIG_NET_SCH_FQ_PIE
          activate CONFIG_NET_SCH_GRED
          activate CONFIG_NET_SCH_HFSC
          activate CONFIG_NET_SCH_HTB
          activate CONFIG_NET_SCH_INGRESS
          activate CONFIG_NET_SCH_MQPRIO
          activate CONFIG_NET_SCH_MULTIQ
          activate CONFIG_NET_SCH_NETEM
          activate CONFIG_NET_SCH_PIE
          activate CONFIG_NET_SCH_PRIO
          activate CONFIG_NET_SCH_RED
          activate CONFIG_NET_SCH_SFQ
          activate CONFIG_NET_SCH_SKBPRIO
          activate CONFIG_NET_SCH_TBF
          activate CONFIG_NET_SCH_TEQL
          activate CONFIG_NET_SCH_DRR
          activate CONFIG_NET_SCH_ETS
          # Actions TC
          activate CONFIG_NET_ACT_CSUM
          activate CONFIG_NET_ACT_GACT
          activate CONFIG_NET_ACT_MIRRED
          activate CONFIG_NET_ACT_PEDIT
          activate CONFIG_NET_ACT_POLICE
          activate CONFIG_NET_ACT_SAMPLE
          activate CONFIG_NET_ACT_SIMP
          activate CONFIG_NET_ACT_SKBEDIT
          activate CONFIG_NET_ACT_SKBMOD
          activate CONFIG_NET_ACT_VLAN
          activate CONFIG_NET_ACT_BPF
          activate CONFIG_NET_CLS_ACT
          activate CONFIG_NET_CLS_BASIC
          activate CONFIG_NET_CLS_BPF
          activate CONFIG_NET_CLS_FLOW
          activate CONFIG_NET_CLS_FLOWER
          activate CONFIG_NET_CLS_FW
          activate CONFIG_NET_CLS_MATCHALL
          activate CONFIG_NET_CLS_ROUTE4
          activate CONFIG_NET_CLS_U32
          activate CONFIG_NET_EMATCH
          activate CONFIG_NET_EMATCH_CMP
          activate CONFIG_NET_EMATCH_META
          activate CONFIG_NET_EMATCH_NBYTE
          activate CONFIG_NET_EMATCH_TEXT
          activate CONFIG_NET_EMATCH_U32
          # Interfaces virtuelles
          activate CONFIG_IFB
          activate CONFIG_TUN
          activate CONFIG_VETH
          activate CONFIG_DUMMY
          activate CONFIG_MACVLAN
          activate CONFIG_IPVLAN
          activate CONFIG_BONDING
          activate CONFIG_VXLAN
          activate CONFIG_MACSEC
          # Netfilter / iptables
          activate CONFIG_NETFILTER
          activate CONFIG_NETFILTER_ADVANCED
          activate CONFIG_NETFILTER_INGRESS
          activate CONFIG_NETFILTER_EGRESS
          activate CONFIG_NF_CONNTRACK
          activate CONFIG_NF_CONNTRACK_MARK
          activate CONFIG_NF_CONNTRACK_EVENTS
          activate CONFIG_NF_CONNTRACK_ZONES
          activate CONFIG_NF_CT_NETLINK
          activate CONFIG_NF_CT_NETLINK_HELPER
          activate CONFIG_NF_CT_NETLINK_TIMEOUT
          activate CONFIG_NF_NAT
          activate CONFIG_NF_FLOW_TABLE
          activate CONFIG_NF_DUP_IPV4
          activate CONFIG_NF_DUP_IPV6
          activate CONFIG_NFT_FLOW_OFFLOAD
          activate CONFIG_NFT_CONNLIMIT
          activate CONFIG_NFT_SOCKET
          activate CONFIG_NFT_TPROXY
          activate CONFIG_NFT_XFRM
          activate CONFIG_NFT_DUP_IPV4
          activate CONFIG_NFT_DUP_IPV6
          activate CONFIG_IP_NF_IPTABLES
          activate CONFIG_IP_NF_FILTER
          activate CONFIG_IP_NF_TARGET_REJECT
          activate CONFIG_IP_NF_MANGLE
          activate CONFIG_IP_NF_RAW
          activate CONFIG_IP_NF_ARPTABLES
          activate CONFIG_IP_NF_ARPFILTER
          activate CONFIG_IP_NF_ARP_MANGLE
          activate CONFIG_IP6_NF_IPTABLES
          activate CONFIG_IP6_NF_FILTER
          activate CONFIG_IP6_NF_MANGLE
          activate CONFIG_IP6_NF_RAW
          activate CONFIG_EBTABLES
          activate CONFIG_BRIDGE_NF_EBTABLES
          activate CONFIG_BRIDGE_EBT_BROUTE
          activate CONFIG_BRIDGE_EBT_T_FILTER
          activate CONFIG_BRIDGE_EBT_T_NAT
          activate CONFIG_BRIDGE_EBT_802_3
          activate CONFIG_BRIDGE_EBT_AMONG
          activate CONFIG_BRIDGE_EBT_ARP
          activate CONFIG_BRIDGE_EBT_IP
          activate CONFIG_BRIDGE_EBT_IP6
          activate CONFIG_BRIDGE_EBT_LIMIT
          activate CONFIG_BRIDGE_EBT_MARK
          activate CONFIG_BRIDGE_EBT_PKTTYPE
          activate CONFIG_BRIDGE_EBT_STP
          activate CONFIG_BRIDGE_EBT_VLAN
          activate CONFIG_BRIDGE_EBT_ARPREPLY
          activate CONFIG_BRIDGE_EBT_DNAT
          activate CONFIG_BRIDGE_EBT_MARK_T
          activate CONFIG_BRIDGE_EBT_REDIRECT
          activate CONFIG_BRIDGE_EBT_SNAT
          activate CONFIG_BRIDGE_EBT_LOG
          activate CONFIG_BRIDGE_EBT_NFLOG
          # IP sets
          activate CONFIG_IP_SET
          activate CONFIG_IP_SET_HASH_IP
          activate CONFIG_IP_SET_HASH_IPMAC
          activate CONFIG_IP_SET_HASH_IPPORT
          activate CONFIG_IP_SET_HASH_NET
          activate CONFIG_IP_SET_LIST_SET
          # Conntrack netlink
          activate CONFIG_NETFILTER_NETLINK_GLUE_CT
          # PPP / tunnels
          activate CONFIG_PPP
          activate CONFIG_PPPOE
          activate CONFIG_PPPOL2TP
          activate CONFIG_PPP_ASYNC
          activate CONFIG_PPP_MPPE
          activate CONFIG_PPP_SYNC_TTY
          activate CONFIG_L2TP
          activate CONFIG_L2TP_ETH
          activate CONFIG_L2TP_IP
          activate CONFIG_NET_IPGRE
          activate CONFIG_NET_IPGRE_DEMUX
          activate CONFIG_NET_IPIP
          activate CONFIG_NET_IPVTI
          activate CONFIG_NET_FOU
          activate CONFIG_IPV6_SIT
          activate CONFIG_IPV6_TUNNEL
          activate CONFIG_IPV6_VTI
          activate CONFIG_IPV6_FOU
          activate CONFIG_INET_AH
          activate CONFIG_INET_ESP
          activate CONFIG_INET_IPCOMP
          activate CONFIG_INET_TUNNEL
          activate CONFIG_INET_DIAG
          activate CONFIG_INET_TCP_DIAG
          activate CONFIG_INET_UDP_DIAG
          # XFRM (VPN)
          activate CONFIG_XFRM_USER
          activate CONFIG_XFRM_INTERFACE
          activate CONFIG_XFRM_IPCOMP
          # QoS / Wireguard / divers
          activate CONFIG_WIREGUARD
          activate CONFIG_TCP_CONG_BBR
          activate CONFIG_TLS
          activate CONFIG_NETCONSOLE
          activate CONFIG_NETLINK_DIAG
          activate CONFIG_PACKET_DIAG
          activate CONFIG_UNIX_DIAG
          activate CONFIG_NET_VRF
          activate CONFIG_PSAMPLE
          activate CONFIG_NET_UDP_TUNNEL
          # Corriger les options bool qui ne peuvent pas être =m
          for opt in XFRM_SUB_POLICY XFRM_MIGRATE XFRM_STATISTICS NF_CT_PROTO_SCTP NF_CT_PROTO_UDPLITE NF_FLOW_TABLE_PROCFS NETFILTER_NETLINK_GLUE_CT NETFILTER_EGRESS NETFILTER_INGRESS; do
            sed -i "s/^CONFIG_${opt}=m/CONFIG_${opt}=y/" target/linux/generic/config-6.12
          done
      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt6000=y
          CONFIG_ALL_KMODS=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_kmod-nft-fullcone=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-sched-core=y
          CONFIG_PACKAGE_kmod-sched-connmark=y
          CONFIG_PACKAGE_kmod-sched=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_ATL2=m
          CONFIG_B53_MDIO_DRIVER=m
          CONFIG_BRIDGE_NETFILTER=m
          CONFIG_INET6_AH=m
          CONFIG_INET6_ESP=m
          CONFIG_INET6_IPCOMP=m
          CONFIG_INET6_TUNNEL=m
          CONFIG_INET6_XFRM_TUNNEL=m
          CONFIG_IP_SCTP=m
          CONFIG_LWTUNNEL=m
          CONFIG_NET_EMATCH=m
          CONFIG_NET_IP_TUNNEL=m
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_iptables-mod-ipopt=y
          CONFIG_PACKAGE_kmod-ipt-core=y
          CONFIG_PACKAGE_kmod-ipt-ipopt=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_tc-full=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_nano=y
          EOF
          make defconfig


      - name: Download sources
        run: make download -j8 V=s 2>&1 | tee download.log

      - name: Build
        run: make -j$(nproc) V=s 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee build_verbose.log

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12-gl-mt6000-fullcone
          path: |
            bin/targets/mediatek/filogic/openwrt-mediatek-filogic-glinet_gl-mt6000-squashfs-sysupgrade.bin
            bin/targets/mediatek/filogic/openwrt-mediatek-filogic-glinet_gl-mt6000-squashfs-factory.bin

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            build_verbose.log
            download.log
